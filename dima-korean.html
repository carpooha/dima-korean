<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дима кушает</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Neucha&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9e7f1; --ink:#1b2140; --muted:#5f6484; --panel:#f6f5fa; --line:#cfcce0;
  --btn:#1b2140; --btn-ink:#ffffff; --on:#e0457b; --on-ink:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12142a; --ink:#ecebf6; --muted:#9a9dbd; --panel:#1c2040; --line:#333963;
    --btn:#f6d0d7; --btn-ink:#1b2140; --on:#e0457b; --on-ink:#ffffff;
  }
}
:root[data-theme="dark"]{
  --bg:#12142a; --ink:#ecebf6; --muted:#9a9dbd; --panel:#1c2040; --line:#333963;
  --btn:#f6d0d7; --btn-ink:#1b2140; --on:#e0457b; --on-ink:#ffffff;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
.app{max-width:900px; margin:0 auto; padding:16px 16px 28px}
header{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; margin-bottom:12px}
h1{
  margin:0; font-family:'Russo One','Arial Black',Impact,sans-serif; font-weight:400;
  font-size:clamp(22px,5vw,34px); line-height:1.1;
}
.chip{
  font:inherit; font-size:14px; font-weight:500; color:var(--ink);
  background:var(--panel); border:1.5px solid var(--line); border-radius:999px;
  padding:8px 14px; cursor:pointer; touch-action:manipulation;
}
.chip:focus-visible,.btn:focus-visible,.pad button:focus-visible{outline:3px solid var(--on); outline-offset:2px}
.stage{
  position:relative; border-radius:20px; overflow:hidden;
  border:1.5px solid var(--line); background:#cdbfae; container-type:inline-size;
  box-shadow:0 14px 34px rgba(20,24,60,.18);
}
canvas{display:block; width:100%; height:auto; aspect-ratio:4/3; touch-action:none; user-select:none; -webkit-user-select:none}
.overlay{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:20px; text-align:center; color:#fdf7fa;
  background:rgba(18,20,42,.70); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
}
.overlay[hidden]{display:none}
.overlay h2{
  margin:0; font-family:'Russo One','Arial Black',Impact,sans-serif; font-weight:400;
  font-size:clamp(28px,7vw,52px); line-height:1.05;
}
.overlay p{margin:0; max-width:470px; line-height:1.5; font-size:clamp(14px,2.5vw,17px)}
.overlay .best{font-size:clamp(13px,2.2vw,15px); opacity:.85}
.btns{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:4px}
.btn{
  font:inherit; cursor:pointer; touch-action:manipulation;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  min-width:150px; padding:12px 22px; border:0; border-radius:14px;
  background:#f6d0d7; color:#1b2140; font-size:17px; font-weight:600;
}
.btn small{font-size:13px; font-weight:400; opacity:.8}
.btn.quiet{background:transparent; color:#fdf7fa; border:1.5px solid rgba(253,247,250,.7)}
.pad{display:none; justify-content:space-between; gap:14px; margin-top:12px}
@media (pointer:coarse){ .pad{display:flex} }
.pad .grp{display:flex; flex-direction:column; gap:10px; flex:1}
.pad button{
  height:66px; border-radius:18px; font:inherit; font-size:28px; cursor:pointer;
  border:1.5px solid var(--line); background:var(--panel); color:var(--ink);
  touch-action:manipulation; user-select:none; -webkit-user-select:none;
}
.pad button.on{background:var(--on); color:var(--on-ink); border-color:transparent}
.hint{margin:12px 2px 0; color:var(--muted); font-size:14px; line-height:1.55; max-width:70ch}
.popup{position:absolute; inset:0; background:rgba(18,20,42,.30); overflow:hidden; cursor:pointer}
.popup[hidden]{display:none}
.popup .face{
  position:absolute; left:1cqw; bottom:-2.5cqw; width:27cqw; height:auto; pointer-events:none;
  filter:drop-shadow(0 .8cqw 1.6cqw rgba(0,0,0,.4));
  transform-origin:50% 100%; animation:faceIn .35s cubic-bezier(.2,.9,.3,1.15) both;
}
.speech{
  position:absolute; left:24cqw; bottom:3cqw; min-width:24cqw; max-width:36cqw;
  transform-origin:0 100%; animation:bubbleIn .3s .16s cubic-bezier(.2,.9,.3,1.35) both;
}
.speech .shape{
  position:absolute; inset:0;
  filter:drop-shadow(.25cqw 0 0 #1b2140) drop-shadow(-.25cqw 0 0 #1b2140) drop-shadow(0 .25cqw 0 #1b2140) drop-shadow(0 -.25cqw 0 #1b2140) drop-shadow(.6cqw .8cqw 0 rgba(27,33,64,.85));
}
.speech .ell{position:absolute; inset:0; background:#fff; border-radius:50% / 48%}
.speech .tail{position:absolute; left:-9cqw; top:calc(100% - 9.5cqw); width:16cqw; height:10cqw; overflow:visible}
.speech .say{
  position:relative; margin:0; padding:3.6cqw 5cqw 4cqw; text-align:center; color:#1b2140;
  font-family:'Neucha','Comic Sans MS','Marker Felt','Chalkboard SE',cursive;
  font-size:clamp(13px,4.2vw,26px); font-size:clamp(13px,4.4cqw,28px); line-height:1.12; text-wrap:balance;
}
.popup.out .face{animation:faceOut .3s ease-in both}
.popup.out .speech{animation:bubbleOut .25s ease-in both}
@keyframes faceIn{from{transform:translateY(40%); opacity:0} to{transform:none; opacity:1}}
@keyframes faceOut{to{transform:translateY(40%); opacity:0}}
@keyframes bubbleIn{from{transform:scale(.4); opacity:0} to{transform:none; opacity:1}}
@keyframes bubbleOut{to{transform:scale(.6); opacity:0}}
@media (prefers-reduced-motion: reduce){ .popup .face,.speech{animation:none !important} }
.overlay.over h2{font-size:clamp(30px,8.6vw,78px); text-transform:uppercase; line-height:1; text-wrap:balance}
.overlay.over #ovText{font-size:clamp(13px,2.2vw,15px); opacity:.9; margin-top:-4px}
.overlay.over .best{margin-top:6px}
</style>
</head>

/* ---------- человек ----------
   Стилизация по фото: короткие русые волосы, щетина, белая свободная футболка,
   тёмно-синие шорты, лёгкие кроссовки в стиле On. */
const SKIN = '#e7b592', SKIN_D = '#b98564';
const HAIR = '#6a5243', HAIR_L = '#92765a', HAIR_D = '#4c3b30';
const TEE = '#f8f8f5', TEE_D = '#cfcfc6';
const SHORTS = '#1f2f5c', SHORTS_D = '#131d40';

function elbowIK(s, h, l1, l2) {
  let dx = h.x - s.x, dy = h.y - s.y;
  let d = Math.hypot(dx, dy) || 1;
  const max = l1 + l2 - 0.5;
  if (d > max) { dx *= max / d; dy *= max / d; d = max; }
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const hh = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const mx = s.x + dx * a / d, my = s.y + dy * a / d;
  const nx = -dy / d, ny = dx / d;
  const e1 = { x: mx + nx * hh, y: my + ny * hh };
  const e2 = { x: mx - nx * hh, y: my - ny * hh };
  const sc = p => p.y + 0.6 * Math.abs(p.x - 400);          // локоть тянем наружу и вниз
  return { e: sc(e1) > sc(e2) ? e1 : e2, h: { x: s.x + dx, y: s.y + dy } };
}

function drawChopsticks(hx, hy, inward) {
  // палочки зажаты в кулаке и наклонены к телу, как перед тем как взять кусочек
  const tilt = 0.3 * inward;
  const ux = Math.sin(tilt), uy = -Math.cos(tilt);
  const px = Math.cos(tilt), py = Math.sin(tilt);
  ctx.lineCap = 'round';
  [[-3, 64], [3, 60]].forEach(([off, L]) => {
    const x0 = hx + px * off, y0 = hy + py * off + 5;
    const x1 = x0 + ux * L - px * off * 0.7, y1 = y0 + uy * L - py * off * 0.7;
    ctx.strokeStyle = '#6b4020'; ctx.lineWidth = 5; seg(x0, y0, x1, y1);
    ctx.strokeStyle = '#e8bb6c'; ctx.lineWidth = 3.5; seg(x0, y0, x1, y1);
    ctx.strokeStyle = '#a56a30'; ctx.lineWidth = 3.5;                     // тёмные кончики
    seg(x1 - ux * 8, y1 - uy * 8, x1, y1);
  });
}

function drawArm(i, hand, chop) {
  const s = SHOULDER[i];
  const img = i === 0 ? IMG.armL : IMG.armR;
  if (ready(img)) {
    const dx = hand.x - s.x, dy = hand.y - s.y;
    const d = Math.hypot(dx, dy) || 1;
    const w = img.naturalWidth * (d / img.naturalHeight);
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(dy, dx) - Math.PI / 2);
    ctx.drawImage(img, -w / 2, 0, w, d);
    ctx.restore();
    if (chop) drawChopsticks(hand.x, hand.y, i === 0 ? 1 : -1);
    return;
  }
  const r = elbowIK(s, hand, 76, 76);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // рука
  ctx.strokeStyle = SKIN_D; ctx.lineWidth = 23; seg(s.x, s.y, r.e.x, r.e.y);
  ctx.lineWidth = 20; seg(r.e.x, r.e.y, r.h.x, r.h.y);
  ctx.strokeStyle = SKIN; ctx.lineWidth = 21; seg(s.x, s.y, r.e.x, r.e.y);
  ctx.lineWidth = 18; seg(r.e.x, r.e.y, r.h.x, r.h.y);
  ctx.fillStyle = SKIN; dot(r.e.x, r.e.y, 9.5);
  if (chop) drawChopsticks(r.h.x, r.h.y, i === 0 ? 1 : -1);
  ctx.strokeStyle = SKIN_D; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(r.h.x, r.h.y, 9.5, 0, Math.PI * 2); ctx.fillStyle = SKIN; ctx.fill(); ctx.stroke();
  // короткий рукав свободной футболки
  const ex = s.x + (r.e.x - s.x) * 0.5, ey = s.y + (r.e.y - s.y) * 0.5;
  ctx.lineCap = 'butt';
  ctx.strokeStyle = TEE_D; ctx.lineWidth = 34; seg(s.x, s.y, ex, ey);
  ctx.strokeStyle = TEE; ctx.lineWidth = 31.5; seg(s.x, s.y, ex, ey);
  ctx.lineCap = 'round';
  ctx.fillStyle = TEE; dot(s.x, s.y, 15.8);
}

    ctx.strokeStyle = '#3a2c20'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(389, 213, 4.8, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
    ctx.beginPath(); ctx.arc(411, 213, 4.8, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
  } else {
    const open = m === 'sad' ? 1 : 0.5;                                   // прищур, как на фото
    [389, 411].forEach(ex => {
      ctx.fillStyle = '#ffffff'; ell(ex, 211, 5.4, 3.6 * open + 0.7);
      ctx.fillStyle = '#6f818c'; dot(ex, 211.4, 2.8);
      ctx.fillStyle = '#161a20'; dot(ex, 211.4, 1.25);
      ctx.strokeStyle = '#3a2c20'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.ellipse(ex, 211, 5.6, 3.6 * open + 0.7, 0, Math.PI * 1.02, Math.PI * 1.98); ctx.stroke();
    });
    if (m !== 'sad') {                                                     // верхнее веко
      ctx.fillStyle = SKIN; ctx.strokeStyle = '#3a2c20'; ctx.lineWidth = 1.8;
      [389, 411].forEach(ex => {
        ctx.beginPath(); ctx.ellipse(ex, 208.6, 5.8, 2.6, 0, Math.PI, 0); ctx.fill();
        ctx.beginPath(); ctx.moveTo(ex - 5.6, 210); ctx.lineTo(ex + 5.6, 210); ctx.stroke();
      });
    }
  }
  // нос: широкий
  ctx.strokeStyle = SKIN_D; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(398, 213); ctx.quadraticCurveTo(393, 222, 395, 225); ctx.quadraticCurveTo(400, 228.5, 405, 225); ctx.stroke();
  ctx.fillStyle = 'rgba(120,70,50,.45)'; dot(396, 225.4, 1.1); dot(404, 225.4, 1.1);
  // рот
  ctx.strokeStyle = '#a5645a'; ctx.lineWidth = 2.2;
  if (m === 'happy') {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(387, 230); ctx.quadraticCurveTo(400, 247, 413, 230); ctx.quadraticCurveTo(400, 233, 387, 230); ctx.closePath();
    ctx.fill(); ctx.stroke();
  } else if (m === 'sad') {
    ctx.fillStyle = '#7a3a34'; ctx.beginPath(); ctx.ellipse(400, 234.5, 5.2, 6.2, 0, 0, Math.PI * 2); ctx.fill();
  } else {
    // расслабленный, чуть приоткрытый рот, уголок слегка вверх
    ctx.strokeStyle = '#8f4f47'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(391, 232); ctx.quadraticCurveTo(400, 233.5, 411, 230.5); ctx.stroke();
    ctx.strokeStyle = '#c27b6f'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(394, 235); ctx.quadraticCurveTo(401, 238.5, 408, 234); ctx.stroke();
  }
  ctx.restore();
}

function drawPerson() {
  ctx.fillStyle = 'rgba(30,15,10,.2)';
  ctx.beginPath(); ctx.ellipse(400, 524, 78, 11, 0, 0, Math.PI * 2); ctx.fill();

  if (ready(IMG.body)) {
    const h = BODY_H, w = IMG.body.naturalWidth * h / IMG.body.naturalHeight;
    ctx.drawImage(IMG.body, 400 - w / 2, 520 - h, w, h);
  } else {
    drawLegsAndShoes();
    drawShorts();
    drawTee();
    drawHead();
  }
  const hd = S.holder;
  drawArm(1 - hd, S.hands[1 - hd], true);       // свободная рука с палочками
  drawArm(hd, S.hands[hd], false);              // рука под тарелкой
  drawPlate(bpos.x, bpos.y);
}

/* ---------- интерфейс на холсте ---------- */
function drawChili(x, y, alive) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.5);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.fillStyle = alive ? '#e0392a' : 'rgba(255,255,255,.28)';
  ctx.strokeStyle = alive ? '#8f1f12' : 'rgba(255,255,255,.45)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-9, -5); ctx.bezierCurveTo(1, -10, 11, -2, 10, 10);
  ctx.bezierCurveTo(4, 5, -3, 1, -9, -1); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = alive ? '#4fa63a' : 'rgba(255,255,255,.4)'; rr(-13, -8, 7, 5, 2); ctx.fill();
  if (!alive) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; seg(-4, -2, 6, 8); seg(6, -2, -4, 8); }
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(38,24,20,.92)'; rr(335, 14, 130, 46, 15); ctx.fill();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 2; rr(339, 18, 122, 38, 12); ctx.stroke();
  ctx.font = '28px "Russo One","Arial Black",Impact,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = GOLD;
  ctx.fillText(String(S.score).padStart(3, '0'), 400, 38);
  // до следующей реплики
  ctx.fillStyle = 'rgba(38,24,20,.9)'; rr(224, 20, 96, 34, 12); ctx.fill();
  drawDish('bibimbap', 0, 247, 38, 0, 0.4, 1);
  ctx.font = '19px "Russo One","Arial Black",Impact,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText((S.score % EVERY) + '/' + EVERY, 289, 38);
  // промахи: перчики справа от счёта
  for (let i = 0; i < 3; i++) drawChili(500 + i * 28, 37, i >= S.misses);
}

/* ---------- отрисовка кадра ---------- */
function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  drawBackground();
  drawRails();

  for (const it of S.items) {
    const p = railPoint(CHUTES[it.c], it.t);
    drawDish(it.kind, it.v, p.x, p.y, Math.sin(S.clock * 9 + it.phase) * 0.07, 1, 1);
  }
  for (const d of S.dropIns) {
    const c = CHUTES[d.c], a = d.age / d.life, e = a * a * (3 - 2 * a);
    const p0 = railPoint(c, 1);
    drawDish(d.kind, d.v, p0.x + (c.bx - p0.x) * e, p0.y + (c.by - 26 - p0.y) * e, 0.3 * e * c.dir, 1 - 0.3 * e, 1 - a);
  }

  drawPerson();

  for (const f of S.fallers) drawDish(f.kind, f.v, f.x, f.y, f.rot, 1, f.alpha);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '22px "Russo One","Arial Black",Impact,sans-serif';
  ctx.lineJoin = 'round'; ctx.lineWidth = 5;
  for (const f of S.floaters) {
    const a = 1 - f.age / f.life;
    ctx.globalAlpha = Math.max(0, a);
    ctx.strokeStyle = '#1b2140'; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  drawHUD();
}

/* ---------- логика ---------- */
function travelTime() { return Math.max(1.05, 2.7 - S.score * 0.014) * (S.variant === 'B' ? 0.82 : 1); }
function spawnGap()   { return Math.max(0.5, 1.3 - S.score * 0.007) * (S.variant === 'B' ? 0.8 : 1); }
function arrivalGap() { return S.variant === 'B' ? 0.42 : 0.55; }

function trySpawn() {
  const T = travelTime();
  for (const it of S.items) {
    if (Math.abs((1 - it.t) * it.T - T) < arrivalGap()) { S.spawnIn = 0.06; return; }
  }
  const free = [0, 1, 2, 3].filter(c => !S.items.some(it => it.c === c && it.t < 0.3));
  if (!free.length) { S.spawnIn = 0.1; return; }
  S.items.push({
    c: free[Math.floor(Math.random() * free.length)],
    kind: KINDS[Math.floor(Math.random() * KINDS.length)],
    v: Math.floor(Math.random() * 12),
    t: 0, T, phase: Math.random() * 6.28
  });
  S.spawnIn = spawnGap() * rnd(0.8, 1.3);
}

function catchItem(it) {
  S.score++;
  S.mood = 'happy'; S.moodT = 0.5;
  S.dropIns.push({ c: it.c, kind: it.kind, v: it.v, age: 0, life: 0.16 });
  S.floaters.push({ x: bpos.x, y: bpos.y - 62, text: '+1', color: GOLD, age: 0, life: 0.8, vy: -50 });
  let forgave = false;
  if (S.score % 30 === 0 && S.misses > 0) {
    S.misses--; forgave = true;
    S.floaters.push({ x: 400, y: 138, text: 'промах прощён', color: '#9ff0c8', age: 0, life: 1.4, vy: -18 });
  }
  if (S.score % EVERY === 0) { showPopup(PHRASES[S.phraseIdx % PHRASES.length]); S.phraseIdx++; }
  else if (forgave) sfx.bonus();
  else sfx.catch();
}

function missItem(it) {
  const c = CHUTES[it.c], p = railPoint(c, 1);
  S.misses++;
  S.mood = 'sad'; S.moodT = 0.9;
  S.fallers.push({ kind: it.kind, v: it.v, x: p.x, y: p.y, vx: c.dir * rnd(10, 40), vy: 0, rot: 0, vr: c.dir * rnd(2, 5), alpha: 1, rest: false, restT: 0 });
  sfx.miss();
  if (S.misses >= 3) gameOver();
}

function gameOver() {
  S.mode = 'over'; S.overT = 1.0;
  const isBest = S.score > best[S.variant];
  if (isBest) { best[S.variant] = S.score; saveBest(S.variant, S.score); }
  S.newRecord = isBest && S.score > 0;
  sfx.over();
}

function update(dt) {
  S.clock += dt;
  if (S.moodT > 0) { S.moodT -= dt; if (S.moodT <= 0) S.mood = 'neutral'; }
  if (S.mode === 'pause') {
    S.popupAge += dt; S.popupT -= dt;
    if (S.popupT < 0.3) popup.classList.add('out');
    if (S.popupT <= 0) resumeGame(true);
  }

  // корзина и руки
  const tg = CHUTES[S.basketIdx];
  const k = 1 - Math.exp(-dt * 30);
  bpos.x += (tg.bx - bpos.x) * k; bpos.y += (tg.by - bpos.y) * k;
  S.holder = bpos.x < 400 ? 0 : 1;
  for (let i = 0; i < 2; i++) {
    const h = S.hands[i];
    let tx, ty, rate;
    if (i === S.holder) { tx = bpos.x; ty = bpos.y + HAND_DY; rate = 60; }
    else { tx = i === 0 ? 354 : 446; ty = 372 + Math.sin(S.clock * 2 + i) * 2; rate = 12; }
    const kk = 1 - Math.exp(-dt * rate);
    h.x += (tx - h.x) * kk; h.y += (ty - h.y) * kk;
  }

  if (S.mode === 'play') {
    S.spawnIn -= dt;
    if (S.spawnIn <= 0) trySpawn();
    for (let i = S.items.length - 1; i >= 0; i--) {
      const it = S.items[i];
      it.t += dt / it.T;
      if (it.t >= 1) {
        S.items.splice(i, 1);
        if (it.c === S.basketIdx) catchItem(it); else missItem(it);
      }
    }
  }
  if (S.mode === 'over' && S.overT > 0) {
    S.overT -= dt;
    if (S.overT <= 0) showOver();
  }

  for (let i = S.dropIns.length - 1; i >= 0; i--) { const d = S.dropIns[i]; d.age += dt; if (d.age >= d.life) S.dropIns.splice(i, 1); }
  for (let i = S.floaters.length - 1; i >= 0; i--) { const f = S.floaters[i]; f.age += dt; f.y += f.vy * dt; if (f.age >= f.life) S.floaters.splice(i, 1); }
  for (let i = S.fallers.length - 1; i >= 0; i--) {
    const f = S.fallers[i];
    if (!f.rest) {
      f.vy += 1500 * dt; f.y += f.vy * dt; f.x += f.vx * dt; f.rot += f.vr * dt;
      if (f.y >= FLOOR_Y) { f.y = FLOOR_Y; f.rest = true; f.vx = 0; }
    } else {
      f.restT += dt; f.alpha = 1 - f.restT / 1.2;
      if (f.alpha <= 0) S.fallers.splice(i, 1);
    }
  }
}

/* ---------- управление ---------- */
const padBtns = Array.from(document.querySelectorAll('.pad button'));
function markPad() { padBtns.forEach(b => b.classList.toggle('on', +b.dataset.idx === S.basketIdx)); }
function setIdx(i) {
  if (S.basketIdx !== i) { S.basketIdx = i; sfx.move(); markPad(); }
}
markPad();

window.addEventListener('keydown', (e) => {
  let side = S.basketIdx >> 1, lvl = S.basketIdx & 1;
  switch (e.code) {
    case 'ArrowLeft':  case 'KeyA': side = 0; break;
    case 'ArrowRight': case 'KeyD': side = 1; break;
    case 'ArrowUp':    case 'KeyW': lvl = 0; break;
    case 'ArrowDown':  case 'KeyS': lvl = 1; break;
    case 'Space': case 'Enter':
      if (!(e.target.closest && e.target.closest('button'))) {
        if (S.mode === 'pause') { e.preventDefault(); resumeGame(); }
        else if (S.mode !== 'play') { e.preventDefault(); start(S.variant); }
      }
      return;
    default: return;
  }
  e.preventDefault();
  if (S.mode === 'play') setIdx(side * 2 + lvl);
});

canvas.addEventListener('pointerdown', (e) => {
  if (S.mode !== 'play') return;
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  setIdx((x < 400 ? 0 : 2) + (y < 334 ? 0 : 1));
});
padBtns.forEach(b => b.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (S.mode === 'play') setIdx(+b.dataset.idx);
}));

const sndBtn = document.getElementById('snd');
sndBtn.addEventListener('click', () => {
  muted = !muted; ensureAudio();
  sndBtn.textContent = muted ? 'Звук выключен' : 'Звук включён';
  sndBtn.setAttribute('aria-pressed', String(!muted));
  if (!muted) sfx.catch();   // проверочный звук
});
if (IS_IOS) {
  const tip = document.createElement('p');
  tip.className = 'hint';
  tip.textContent = 'Нет звука на iPhone? Проверьте, что беззвучный режим выключен (переключатель на боковой грани) и громкость не на нуле. Затем нажмите «Звук»: он сыграет проверочный сигнал.';
  document.querySelector('.hint').after(tip);
}

/* ---------- всплывающая реплика ---------- */
const popup = document.getElementById('popup');
const popSay = document.getElementById('say');
function showPopup(text) {
  popSay.textContent = text;
  S.mode = 'pause'; S.popupT = 2.0; S.popupAge = 0;
  S.mood = 'sad'; S.moodT = 99;
  popup.classList.remove('out');
  popup.hidden = false;
  sfx.bonus();
}
function resumeGame(force) {
  if (S.mode !== 'pause') return;
  if (force !== true && S.popupAge < 0.5) return;      // тап сразу после появления не считается
  popup.hidden = true; popup.classList.remove('out');
  S.mode = 'play'; S.mood = 'neutral'; S.moodT = 0;
  S.spawnIn = Math.max(S.spawnIn, 0.8);
}
popup.addEventListener('click', resumeGame);

/* ---------- экраны ---------- */
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');
const ovBest = document.getElementById('ovBest');
const ovBtns = document.getElementById('ovBtns');

function addBtn(title, sub, fn, quiet) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'btn' + (quiet ? ' quiet' : '');
  const t = document.createElement('span'); t.textContent = title; b.appendChild(t);
  if (sub) { const s = document.createElement('small'); s.textContent = sub; b.appendChild(s); }
  b.addEventListener('click', fn);
  ovBtns.appendChild(b);
  return b;
}
function bestLine() { return 'Рекорд в игре A: ' + best.A + ', в игре B: ' + best.B; }

function showMenu() {
  overlay.classList.remove('over');
  ovTitle.textContent = 'Дима кушает';
  ovText.textContent = 'Лови блюда, пока они не упали, и смотри не урони! Три блюда упадут на пол, и ты проиграл.';
  ovBest.textContent = bestLine();
  ovBtns.textContent = '';
  const a = addBtn('Игра A', 'спокойный темп', () => start('A'));
  addBtn('Игра B', 'быстрее и плотнее', () => start('B'));
  overlay.hidden = false;
  a.focus({ preventScroll: true });
}
function showOver() {
  overlay.classList.add('over');
  ovTitle.textContent = 'Обед окончен';
  ovText.textContent = 'Три блюда упали на пол.';
  ovBest.textContent = 'Поймано блюд: ' + S.score + '. ' + (S.newRecord ? 'Новый рекорд!' : 'Рекорд в игре ' + S.variant + ': ' + best[S.variant] + '.');
  ovBtns.textContent = '';
  const again = addBtn('Ещё раз', 'игра ' + S.variant, () => start(S.variant));
  addBtn('В меню', '', () => { S.mode = 'menu'; showMenu(); }, true);
  overlay.hidden = false;
  again.focus({ preventScroll: true });
}

function start(v) {
  ensureAudio();
  S.variant = v; S.mode = 'play';
  S.score = 0; S.misses = 0; S.phraseIdx = 0; S.overT = 0; S.newRecord = false;
  popup.hidden = true;
  S.items.length = 0; S.dropIns.length = 0; S.fallers.length = 0; S.floaters.length = 0;
  S.spawnIn = 0.7; S.mood = 'neutral'; S.moodT = 0;
  overlay.hidden = true;
}

/* ---------- цикл ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
